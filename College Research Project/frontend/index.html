<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>PromptShield - LLM Security Testing Platform</title>
    <meta name="description" content="PromptShield is an advanced LLM security testing platform that helps identify vulnerabilities in AI language models through prompt injection, jailbreak, and data extraction attacks." />
    <meta name="keywords" content="LLM security, prompt injection, jailbreak testing, AI security, GPT security, ChatGPT vulnerabilities, OWASP LLM, AI red teaming" />
    <meta name="author" content="PromptShield Team" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PromptShield - LLM Security Testing Platform" />
    <meta property="og:description" content="Identify vulnerabilities in AI language models with 52+ attack vectors. Test GPT, Claude, Llama, and more." />
    <meta property="og:url" content="https://promptshield.dev" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PromptShield - LLM Security Testing" />
    <meta name="twitter:description" content="Test your AI models for prompt injection, jailbreaks, and data extraction vulnerabilities." />
    
    <!-- Theme & PWA -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Security Headers (CSP via meta) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://promptshield.dev" />
  </head>
  <body>
    <!-- Accessibility: Skip to main content link -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-indigo-600 focus:text-white focus:rounded-lg">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PromptShield",
      "description": "LLM Security Testing Platform for identifying vulnerabilities in AI language models",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "PromptShield Team"
      }
    }
    </script>
  </body>
</html>
